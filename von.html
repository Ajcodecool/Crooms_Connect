<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Connection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            background-image: radial-gradient(ellipse at center, rgba(30, 30, 30, 0.3) 0%, #000000 70%);
            overflow: hidden; 
        }

        .font-tech-mono {
            font-family: 'Share Tech Mono', monospace;
        }

        @keyframes pulse-glow {
            0%, 100% {
                color: #fca5a5; 
                text-shadow: 0 0 10px #ef4444, 0 0 20px #dc2626;
            }
            50% {
                color: #ef4444; 
                text-shadow: 0 0 15px #dc2626, 0 0 30px #b91c1c;
            }
        }

        @keyframes pulse-subtle {
            0%, 100% {
                color: #4b5563; 
                opacity: 0.7;
            }
            50% {
                color: #6b7280; 
                opacity: 1;
            }
        }

        .countdown-number {
            animation: pulse-glow 2.5s ease-in-out infinite;
        }

        .footer-text {
            animation: pulse-subtle 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-black text-gray-300 flex flex-col min-h-screen justify-between items-center p-4">

    <header class="absolute top-0 left-0 p-4 sm:p-6">
        <a href="index.html" class="text-gray-600 hover:text-gray-400 transition-colors duration-300 text-sm font-tech-mono">
            &lt;-- BACK TO HOME
        </a>
    </header>

    <main class="flex flex-col items-center justify-center text-center flex-grow pt-16 pb-20">
        <h1 class="text-xl sm:text-2xl text-gray-500 font-light mb-6 font-tech-mono">Von's time is approaching.</h1>
        
        <div id="countdown" class="flex flex-wrap justify-center items-center gap-4 sm:gap-8">
            <div class="flex flex-col items-center w-24 h-24 sm:w-32 sm:h-32 justify-center bg-black/30 rounded-lg border border-gray-900 shadow-xl">
                <span id="days" class="font-tech-mono text-5xl sm:text-6xl font-bold countdown-number">00</span>
                <span class="text-gray-500 text-xs sm:text-sm uppercase tracking-wider">Days</span>
            </div>
            <div class="flex flex-col items-center w-24 h-24 sm:w-32 sm:h-32 justify-center bg-black/30 rounded-lg border border-gray-900 shadow-xl">
                <span id="hours" class="font-tech-mono text-5xl sm:text-6xl font-bold countdown-number">00</span>
                <span class="text-gray-500 text-xs sm:text-sm uppercase tracking-wider">Hours</span>
            </div>
            <div class="flex flex-col items-center w-24 h-24 sm:w-32 sm:h-32 justify-center bg-black/30 rounded-lg border border-gray-900 shadow-xl">
                <span id="minutes" class="font-tech-mono text-5xl sm:text-6xl font-bold countdown-number">00</span>
                <span class="text-gray-500 text-xs sm:text-sm uppercase tracking-wider">Minutes</span>
            </div>
            <div class="flex flex-col items-center w-24 h-24 sm:w-32 sm:h-32 justify-center bg-black/30 rounded-lg border border-gray-900 shadow-xl">
                <span id="seconds" class="font-tech-mono text-5xl sm:text-6xl font-bold countdown-number">00</span>
                <span class="text-gray-500 text-xs sm:text-sm uppercase tracking-wider">Seconds</span>
            </div>
        </div>
        
        <div id="expired-message" class="hidden mt-10">
            <h2 class="text-4xl sm:text-5xl font-tech-mono text-red-500">The connection is live.</h2>
        </div>

    </main>

    <footer class="w-full text-center p-4 sm:p-6 pb-8">
        <p class="font-tech-mono text-sm uppercase tracking-widest footer-text">
            VON'S CONNECTION
        </p>
    </footer>

    <script>
        const now = new Date();
        let targetYear = now.getFullYear();
        
        const targetDate = new Date(Date.UTC(targetYear, 10, 20, 17, 0, 0)); 
        
        if (now.getTime() > targetDate.getTime()) {
            targetYear++;
            targetDate.setUTCFullYear(targetYear);
        }

        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const countdownEl = document.getElementById('countdown');
        const expiredMessageEl = document.getElementById('expired-message');

        function updateCountdown() {
            const currentTime = new Date().getTime();
            const distance = targetDate.getTime() - currentTime;

            if (distance <= 0) {
                clearInterval(countdownInterval);
                countdownEl.classList.add('hidden');
                expiredMessageEl.classList.remove('hidden');
                daysEl.classList.remove('countdown-number');
                hoursEl.classList.remove('countdown-number');
                minutesEl.classList.remove('countdown-number');
                secondsEl.classList.remove('countdown-number');
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            daysEl.textContent = String(days).padStart(2, '0');
            hoursEl.textContent = String(hours).padStart(2, '0');
            minutesEl.textContent = String(minutes).padStart(2, '0');
            secondsEl.textContent = String(seconds).padStart(2, '0');
        }

        updateCountdown();

        const countdownInterval = setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
